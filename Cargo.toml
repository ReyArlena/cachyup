[package]
name = "cachyup"
version = "0.1.0"
edition = "2024"
authors = ["ReyArlena"]
description = "Set up and update a CachyOS install: system update, apps, tweaks and cleanup, with a TUI and a headless mode"
license = "MIT"
repository = "https://github.com/ReyArlena/cachyup"
homepage = "https://github.com/ReyArlena/cachyup"
readme = "README.md"

[[bin]]
name = "cachyup"
path = "src/main.rs"

[lib]
name = "cachyup"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["osc52"] }
nix = { version = "0.31.3", features = ["signal", "process", "user"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"
