# The built-in app and tweak list. Compiled into the binary.
#
# Package lists are plain names, or an inline table when an entry needs more:
#   { name = "junction", unless_cmd = "dms" }
#     unless_cmd   default to off when this command exists (the app list says
#                  which package provides it)
#     default      true/false, overrides the normal default (on)
#     description  one line; otherwise it is read from the package source
#
# Users add their own in ~/.config/cachyup/user-apps.toml, same layout.

# Installed before everything else whenever a run does anything. Needed by
# cachyup itself, never shown in the app list.
prerequisites = [
    "archlinux-contrib", # checkservices (services needing a restart)
    "base-devel",        # makepkg, for AUR builds
    "git",
    "pacman-contrib",    # paccache, pacdiff (cleanup and .pacnew check)
    "rebuild-detector",  # checkrebuild (AUR packages needing a rebuild)
    "yay",               # AUR helper (cachyos repo)
]

