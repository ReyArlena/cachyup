# Apps with their own install script, run as your user with bash.
#   check    a command on PATH or a path (~ allowed); present = installed
#   install  shell command run with `bash -c`
[[installer]]
name = "claude"
label = "Claude Code"
description = "Anthropic's coding agent for the terminal (native installer, ~/.local/bin/claude)"
check = "~/.local/bin/claude"
install = "curl -fsSL https://claude.ai/install.sh | bash"

[[installer]]
name = "kiln"
description = "Hardware burn-in and diagnostics runner (~/.local/bin/kiln)"
check = "~/.local/bin/kiln"
install = "curl -fsSL https://raw.githubusercontent.com/ReyArlena/kiln/main/install.sh | sh"

[[installer]]
name = "spotify-url-helper"
label = "Spotify Helper"
description = "Own installer: ~/.local/bin/spotify-url-helper and a .desktop file"
check = "~/.local/bin/spotify-url-helper"
install = "curl -fsSL https://raw.githubusercontent.com/ReyArlena/spotify-url-helper/main/install.sh | sh"

# Config tweaks. `app` ties a tweak to an app (shown under it in the app list,
# skipped while that app is not installed). Each `set` entry writes one value:
#   { json = FILE, key = "a.b", value = ... }                  JSON key (dotted path)
#   { ini = FILE, section = "S", key = "k", value = "v" }      ini-style key
# Files are written through symlinks, so stow-managed dotfiles stay links.
[[tweak]]
id = "discord-skip-host-update"
app = "pacman/discord"
name = "Disable host update"
description = "Stop Discord blocking launch until it self-updates; pacman owns updates."
set = [{ json = "~/.config/discord/settings.json", key = "SKIP_HOST_UPDATE", value = true }]

[[tweak]]
id = "discordptb-skip-host-update"
app = "aur/discord-ptb"
name = "Disable host update"
description = "Stop Discord PTB blocking launch until it self-updates; yay owns updates."
set = [{ json = "~/.config/discordptb/settings.json", key = "SKIP_HOST_UPDATE", value = true }]

[[tweak]]
id = "junction-default-browser"
app = "pacman/junction"
name = "Set as default link handler"
description = "Make Junction open http/https links, so clicking a link asks which app to use."
unless_cmd = "dms"
set = [
    { ini = "~/.config/mimeapps.list", section = "Default Applications", key = "x-scheme-handler/http", value = "re.sol.junction.desktop" },
    { ini = "~/.config/mimeapps.list", section = "Default Applications", key = "x-scheme-handler/https", value = "re.sol.junction.desktop" },
]
